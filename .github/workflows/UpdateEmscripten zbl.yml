name: Byzbl Update Game Data and Recompile wasm

on:
    workflow_dispatch:
    push:
        tags:
            - '*'
        #paths-ignore:
         #   - 'data/**'
          #  - 'build_js/**'


jobs:
    update:
        continue-on-error: false
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
            - name: Update Game Data
              run: python data/checkUpdate.py
            - name: Commit files
              run: |
                  git config --local user.email "850025847+github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  git add data -f
                  git commit -m "Update Game Data"
            - name: Push changes
              uses: ad-m/github-push-action@master
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  branch: ${{ github.ref }}


